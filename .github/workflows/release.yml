name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  renderer:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: 24
    - run: npm ci
      working-directory: ./renderer
    - run: npm run make-index-files
      working-directory: ./renderer
    - run: npm run lint
      working-directory: ./renderer
    - run: npm run build
      working-directory: ./renderer
    - uses: actions/upload-artifact@v7
      with:
        name: renderer-dist
        path: ./renderer/dist
        retention-days: 1

  package:
    needs: renderer
    strategy:
      matrix:
        os: [windows-2025, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: 24
    - uses: actions/download-artifact@v8
      with:
        name: renderer-dist
        path: ./renderer/dist
    - run: npm ci
      working-directory: ./main
    - name: Verify tag matches package version
      if: ${{ startsWith(github.ref, 'refs/tags/v') }}
      shell: bash
      run: |
        version=$(node -p "require('./main/package.json').version")
        tag="${GITHUB_REF_NAME}"
        if [ "v${version}" != "${tag}" ]; then
          echo "Tag ${tag} does not match version ${version} in main/package.json" >&2
          exit 1
        fi
    - run: npm run build
      working-directory: ./main
    - run: npm run package "--" --config electron-builder.fork.yml -p onTag
      working-directory: ./main
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Artifacts
      if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
      uses: actions/upload-artifact@v7
      with:
        name: dist-${{ matrix.os }}
        path: |
          ./main/dist/*.exe
          ./main/dist/*.AppImage
          ./main/dist/latest*.yml
        retention-days: 14
    - name: Hash
      if: ${{ startsWith(matrix.os, 'windows') }}
      run: type .\main\dist\latest.yml
    - name: Hash
      if: ${{ startsWith(matrix.os, 'ubuntu') }}
      run: cat ./main/dist/latest-linux.yml
